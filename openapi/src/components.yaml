# Shared JSON:API building blocks. Everything here is wire-exact Keygen:
# attribute keys are camelCase, timestamps are RFC3339 with millisecond
# precision and a Z suffix, every always-emitted field is required.
components:
  parameters:
    AccountPath:
      name: account
      in: path
      required: true
      description: Account id (UUID) or slug.
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      description: Offset pagination page number (1-100).
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    PageSize:
      name: page[size]
      in: query
      description: Page size (1-100); defaults to the limit.
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    PageCursor:
      name: page[cursor]
      in: query
      description: Keyset pagination cursor (a record UUID).
      schema:
        type: ["string", "null"]
    Limit:
      name: limit
      in: query
      description: Number of records to return (1-100, default 10).
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    Order:
      name: order
      in: query
      description: Sort order (default desc in production).
      schema:
        type: ["string", "null"]
        enum: [asc, desc, null]


    ProductPath:
      name: productId
      in: path
      required: true
      description: Product id (UUID) or code.
      schema:
        type: string
    PolicyPath:
      name: policyId
      in: path
      required: true
      description: Policy id (UUID).
      schema:
        type: string
    EntitlementPath:
      name: entitlementId
      in: path
      required: true
      description: Entitlement id (UUID) or code.
      schema:
        type: string
    KeyPath:
      name: keyId
      in: path
      required: true
      description: Key id (UUID).
      schema:
        type: string
    LicensePath:
      name: licenseId
      in: path
      required: true
      description: License id (UUID) or key.
      schema:
        type: string
    MachinePath:
      name: machineId
      in: path
      required: true
      description: Machine id (UUID) or fingerprint.
      schema:
        type: string
    TokenPath:
      name: tokenId
      in: path
      required: true
      description: Token id (UUID).
      schema:
        type: string
    UserPath:
      name: userId
      in: path
      required: true
      description: User id (UUID) or email.
      schema:
        type: string

    # ListLinks is the links object of a collection response: the
    # offset mode's full set (first/last always, prev/next null at the
    # ends, pagination meta nested inside), the keyset mode's self/next
    # pair, and nothing at all in the default limit mode.
  schemas:
    Timestamp:
      # RFC3339 with exactly 3 fractional digits and a Z suffix,
      # e.g. 2026-10-22T11:23:22.953Z. Never `format: date-time`: we
      # control the rendering.
      type: string

    Metadata:
      # Free-form vendor JSON; keys are stored snake_case and rendered
      # lowerCamelCase exactly like Keygen transforms them.
      type: object
      additionalProperties: true

    ResourceIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string

    ResourceLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string

    RelationshipLinks:
      type: object
      required: [related]
      properties:
        related:
          type: ["string", "null"]

    ToOneRelationship:
      # belongs_to-style: linkage always emitted, null when absent.
      type: object
      required: [links, data]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        data:
          anyOf:
            - $ref: "#/components/schemas/ResourceIdentifier"
            - type: "null"

    ToManyRelationship:
      # has_many: related link only, plus optional meta (e.g. counts).
      type: object
      required: [links]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        meta:
          type: object
          additionalProperties: true

    PaginationMeta:
      type: object
      required: [pages, count]
      properties:
        pages:
          type: integer
        count:
          type: integer

    ErrorSource:
      type: object
      properties:
        pointer:
          type: string
        parameter:
          type: string
        header:
          type: string

    ErrorLinks:
      type: object
      properties:
        about:
          type: string

    Error:
      type: object
      required: [title, detail]
      properties:
        title:
          type: string
        detail:
          type: string
        code:
          # Absent on typed-params and policy errors; never null.
          type: string
        source:
          $ref: "#/components/schemas/ErrorSource"
        links:
          $ref: "#/components/schemas/ErrorLinks"

    ErrorDocument:
      # meta.id is the request UUID on every error rendered through the
      # application (middleware-level errors have no meta).
      type: object
      required: [meta, errors]
      properties:
        meta:
          type: object
          required: [id]
          properties:
            id:
              type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"

    UserAttributes:
      type: object
      required: [fullName, firstName, lastName, email, status, role, metadata, created, updated]
      properties:
        fullName:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
        role:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    UserRelationships:
      type: object
      required: [account, group, products, licenses, machines, tokens, secondFactors]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        group:
          $ref: "#/components/schemas/ToOneRelationship"
        products:
          $ref: "#/components/schemas/ToManyRelationship"
        licenses:
          $ref: "#/components/schemas/ToManyRelationship"
        machines:
          $ref: "#/components/schemas/ToManyRelationship"
        tokens:
          $ref: "#/components/schemas/ToManyRelationship"
        secondFactors:
          $ref: "#/components/schemas/ToManyRelationship"

    UserResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [users]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/UserAttributes"
        relationships:
          $ref: "#/components/schemas/UserRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserResource"

    TokenAttributes:
      # token (the raw secret) and the activation counters are optional:
      # the secret only on creation/regeneration, the counters only on
      # activation tokens.
      type: object
      required: [kind, expiry, name, created, updated]
      properties:
        kind:
          type: string
        token:
          # Present only on creation/regeneration responses; omitted
          # everywhere else (the reference's conditional attribute).
          type: string
        expiry:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        maxActivations:
          type: ["integer", "null"]
        activations:
          type: ["integer", "null"]
        maxDeactivations:
          type: ["integer", "null"]
        deactivations:
          type: ["integer", "null"]
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    TokenRelationships:
      type: object
      required: [account, bearer]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        bearer:
          $ref: "#/components/schemas/ToOneRelationship"

    TokenResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [tokens]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/TokenAttributes"
        relationships:
          $ref: "#/components/schemas/TokenRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    TokenDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TokenResource"

    ProfileMeta:
      type: object
      required: [tokenId]
      properties:
        tokenId:
          type: ["string", "null"]

    ProfileDocument:
      type: object
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/UserResource"
            - $ref: "#/components/schemas/ProductResource"
            - $ref: "#/components/schemas/LicenseResource"
        meta:
          $ref: "#/components/schemas/ProfileMeta"

    MeDocument:
      # The current bearer (user, product or license) plus, for token
      # authn, the current token in included (without its secret); the
      # reference omits included entirely without one.
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/UserResource"
            - $ref: "#/components/schemas/ProductResource"
            - $ref: "#/components/schemas/LicenseResource"
        included:
          type: array
          items:
            $ref: "#/components/schemas/TokenResource"


# --- products/policies/entitlements/keys (B1) ---
    ListLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string
        first:
          type: string
        last:
          type: string
        prev:
          type: ["string", "null"]
        next:
          type: ["string", "null"]
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ProductAttributes:
      type: object
      required: [name, code, distributionStrategy, url, platforms, metadata, created, updated]
      properties:
        name:
          type: string
        code:
          type: ["string", "null"]
        distributionStrategy:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        platforms:
          type: ["array", "null"]
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    ProductRelationships:
      type: object
      required: [account, policies, licenses, machines, users, tokens, platforms, channels, releases, artifacts]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        policies:
          $ref: "#/components/schemas/ToManyRelationship"
        licenses:
          $ref: "#/components/schemas/ToManyRelationship"
        machines:
          $ref: "#/components/schemas/ToManyRelationship"
        users:
          $ref: "#/components/schemas/ToManyRelationship"
        tokens:
          $ref: "#/components/schemas/ToManyRelationship"
        platforms:
          $ref: "#/components/schemas/ToManyRelationship"
        channels:
          $ref: "#/components/schemas/ToManyRelationship"
        releases:
          $ref: "#/components/schemas/ToManyRelationship"
        artifacts:
          $ref: "#/components/schemas/ToManyRelationship"

    ProductResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [products]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ProductAttributes"
        relationships:
          $ref: "#/components/schemas/ProductRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    ProductDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProductResource"

    ProductListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    PolicyAttributes:
      type: object
      required:
        [name, duration, strict, floating, usePool, maxMachines, maxProcesses, maxUsers,
         maxCores, maxMemory, maxDisk, maxUses, machineUniquenessStrategy,
         machineMatchingStrategy, componentUniquenessStrategy, componentMatchingStrategy,
         expirationStrategy, expirationBasis, renewalBasis, transferStrategy,
         authenticationStrategy, machineLeasingStrategy, processLeasingStrategy,
         overageStrategy, scheme, encrypted, protected, requireProductScope,
         requirePolicyScope, requireMachineScope, requireFingerprintScope,
         requireComponentsScope, requireUserScope, requireChecksumScope,
         requireVersionScope, requireCheckIn, checkInInterval, checkInIntervalCount,
         heartbeatDuration, heartbeatCullStrategy, heartbeatResurrectionStrategy,
         heartbeatBasis, requireHeartbeat, metadata, created, updated]
      properties:
        name:
          type: string
        duration:
          type: ["integer", "null"]
        strict:
          type: boolean
        floating:
          type: boolean
        usePool:
          type: boolean
        maxMachines:
          type: ["integer", "null"]
        maxProcesses:
          type: ["integer", "null"]
        maxUsers:
          type: ["integer", "null"]
        maxCores:
          type: ["integer", "null"]
        maxMemory:
          type: ["integer", "null"]
        maxDisk:
          type: ["integer", "null"]
        maxUses:
          type: ["integer", "null"]
        machineUniquenessStrategy:
          type: ["string", "null"]
        machineMatchingStrategy:
          type: ["string", "null"]
        componentUniquenessStrategy:
          type: ["string", "null"]
        componentMatchingStrategy:
          type: ["string", "null"]
        expirationStrategy:
          type: ["string", "null"]
        expirationBasis:
          type: ["string", "null"]
        renewalBasis:
          type: ["string", "null"]
        transferStrategy:
          type: ["string", "null"]
        authenticationStrategy:
          type: ["string", "null"]
        machineLeasingStrategy:
          type: ["string", "null"]
        processLeasingStrategy:
          type: ["string", "null"]
        overageStrategy:
          type: ["string", "null"]
        scheme:
          type: ["string", "null"]
        encrypted:
          type: boolean
        protected:
          type: ["boolean", "null"]
        requireProductScope:
          type: boolean
        requirePolicyScope:
          type: boolean
        requireMachineScope:
          type: boolean
        requireFingerprintScope:
          type: boolean
        requireComponentsScope:
          type: boolean
        requireUserScope:
          type: boolean
        requireChecksumScope:
          type: boolean
        requireVersionScope:
          type: boolean
        requireCheckIn:
          type: boolean
        checkInInterval:
          type: ["string", "null"]
        checkInIntervalCount:
          type: ["integer", "null"]
        heartbeatDuration:
          type: ["integer", "null"]
        heartbeatCullStrategy:
          type: ["string", "null"]
        heartbeatResurrectionStrategy:
          type: ["string", "null"]
        heartbeatBasis:
          type: ["string", "null"]
        requireHeartbeat:
          type: boolean
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    PolicyRelationships:
      type: object
      required: [account, product, pool, licenses, entitlements]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        product:
          $ref: "#/components/schemas/ToOneRelationship"
        pool:
          $ref: "#/components/schemas/ToManyRelationship"
        licenses:
          $ref: "#/components/schemas/ToManyRelationship"
        entitlements:
          $ref: "#/components/schemas/ToManyRelationship"

    PolicyResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [policies]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/PolicyAttributes"
        relationships:
          $ref: "#/components/schemas/PolicyRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    PolicyDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PolicyResource"

    PolicyListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    EntitlementAttributes:
      type: object
      required: [name, code, metadata, created, updated]
      properties:
        name:
          type: string
        code:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    EntitlementResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [entitlements]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/EntitlementAttributes"
        relationships:
          type: object
          required: [account]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    EntitlementDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EntitlementResource"

    EntitlementListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EntitlementResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    KeyAttributes:
      type: object
      required: [key, created, updated]
      properties:
        key:
          type: string
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    KeyRelationships:
      type: object
      required: [account, product, policy]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        product:
          $ref: "#/components/schemas/ToOneRelationship"
        policy:
          $ref: "#/components/schemas/ToOneRelationship"

    KeyResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [keys]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/KeyAttributes"
        relationships:
          $ref: "#/components/schemas/KeyRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    KeyDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/KeyResource"

    KeyListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/KeyResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    # The policy_entitlements join resource the attach route answers.
    PolicyEntitlementLinks:
      type: object
      required: [related]
      properties:
        related:
          type: string

    PolicyEntitlementResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [policy-entitlements]
        id:
          type: string
        attributes:
          type: object
          required: [created, updated]
          properties:
            created:
              $ref: "#/components/schemas/Timestamp"
            updated:
              $ref: "#/components/schemas/Timestamp"
        relationships:
          type: object
          required: [account, entitlement, policy]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            entitlement:
              $ref: "#/components/schemas/ToOneRelationship"
            policy:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/PolicyEntitlementLinks"

    PolicyEntitlementListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyEntitlementResource"

    # Licenses/machines relationship collections: right shape (empty
    # data array + links) until the licenses/machines groups land; the
    # item schema stays opaque.
    LicenseStubListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
        links:
          $ref: "#/components/schemas/ListLinks"

    MachineStubListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
        links:
          $ref: "#/components/schemas/ListLinks"

    ProductUserListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    ProductTokenListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenResource"
        links:
          $ref: "#/components/schemas/ListLinks"


    # --- users/groups/tokens/second-factors (resource group B2) ---

    UserCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    TokenCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    GroupAttributes:
      type: object
      required: [name, maxUsers, maxLicenses, maxMachines, metadata, created, updated]
      properties:
        name:
          type: ["string", "null"]
        maxUsers:
          type: ["integer", "null"]
        maxLicenses:
          type: ["integer", "null"]
        maxMachines:
          type: ["integer", "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    GroupRelationships:
      type: object
      required: [account, owners, users, licenses, machines]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        owners:
          $ref: "#/components/schemas/ToManyRelationship"
        users:
          $ref: "#/components/schemas/ToManyRelationship"
        licenses:
          $ref: "#/components/schemas/ToManyRelationship"
        machines:
          $ref: "#/components/schemas/ToManyRelationship"

    GroupResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [groups]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/GroupAttributes"
        relationships:
          $ref: "#/components/schemas/GroupRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    GroupDocument:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/GroupResource"
            - type: "null"

    GroupCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GroupResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    GroupOwnerResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [group-owners]
        id:
          type: string
        attributes:
          type: object
          required: [created, updated]
          properties:
            created:
              $ref: "#/components/schemas/Timestamp"
            updated:
              $ref: "#/components/schemas/Timestamp"
        relationships:
          type: object
          required: [account, group, user]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            group:
              $ref: "#/components/schemas/ToOneRelationship"
            user:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    GroupOwnerDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/GroupOwnerResource"

    GroupOwnerCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GroupOwnerResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    SecondFactorAttributes:
      # uri/secret render only while the factor is disabled.
      type: object
      required: [enabled, created, updated]
      properties:
        # uri/secret render only while the factor is disabled; omitted
        # otherwise.
        uri:
          type: string
        secret:
          type: string
        enabled:
          type: boolean
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    SecondFactorResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [second-factors]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SecondFactorAttributes"
        relationships:
          type: object
          required: [account, user]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            user:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    SecondFactorDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SecondFactorResource"

    SecondFactorCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecondFactorResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    # Minimal product/license/machine documents for the user and group
    # relationship indexes. The full resource groups own their schemas;
    # these render the same wire shapes for records reached through the
    # users/groups relationships.
    UserProductAttributes:
      type: object
      additionalProperties: true

    UserProductResource:
      type: object
      required: [type, id, links]
      properties:
        type:
          type: string
          enum: [products]
        id:
          type: string
        attributes:
          type: ["object", "null"]
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserProductDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserProductResource"

    UserProductCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserProductResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    UserLicenseResource:
      type: object
      required: [type, id, links]
      properties:
        type:
          type: string
          enum: [licenses]
        id:
          type: string
        attributes:
          type: ["object", "null"]
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserLicenseDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserLicenseResource"

    UserLicenseCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserLicenseResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    UserMachineResource:
      type: object
      required: [type, id, links]
      properties:
        type:
          type: string
          enum: [machines]
        id:
          type: string
        attributes:
          type: ["object", "null"]
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserMachineDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserMachineResource"

    UserMachineCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserMachineResource"
        links:
          $ref: "#/components/schemas/ListLinks"


    # --- licenses (resource group B3) ---

    LicenseAttributes:
      type: object
      required:
        [name, expiry, status, uses, suspended, scheme, encrypted, strict,
         floating, protected, version, maxMachines, maxProcesses, maxUsers,
         maxCores, maxMemory, maxDisk, maxUses, requireHeartbeat,
         requireCheckIn, lastValidated, lastCheckIn, nextCheckIn,
         lastCheckOut, metadata, created, updated]
      properties:
        name:
          type: ["string", "null"]
        key:
          # Omitted entirely for a legacy-encrypted license whose raw
          # plaintext is unavailable (every read after creation).
          type: string
        expiry:
          type: ["string", "null"]
        status:
          type: string
        uses:
          type: integer
        suspended:
          type: boolean
        scheme:
          type: ["string", "null"]
        encrypted:
          type: boolean
        strict:
          type: boolean
        floating:
          type: boolean
        protected:
          type: boolean
        version:
          type: ["string", "null"]
        maxMachines:
          type: ["integer", "null"]
        maxProcesses:
          type: ["integer", "null"]
        maxUsers:
          type: ["integer", "null"]
        maxCores:
          type: ["integer", "null"]
        maxMemory:
          type: ["integer", "null"]
        maxDisk:
          type: ["integer", "null"]
        maxUses:
          type: ["integer", "null"]
        requireHeartbeat:
          type: boolean
        requireCheckIn:
          type: boolean
        lastValidated:
          type: ["string", "null"]
        lastCheckIn:
          type: ["string", "null"]
        nextCheckIn:
          type: ["string", "null"]
        lastCheckOut:
          type: ["string", "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    LicenseUsersRelationship:
      type: object
      required: [links, meta]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        meta:
          type: object
          required: [count]
          properties:
            count:
              type: integer

    LicenseMachinesRelationship:
      type: object
      required: [links, meta]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        meta:
          type: object
          required: [cores, memory, disk, count]
          properties:
            cores:
              type: integer
            memory:
              type: integer
            disk:
              type: integer
            count:
              type: integer

    LicenseRelationships:
      type: object
        # account, product, policy, group, owner carry always-emitted
        # linkage (null for an absent group/owner); users and machines
        # are link+meta to-many; tokens and entitlements link-only.
      required: [account, product, policy, group, owner, users, machines, tokens, entitlements]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        product:
          $ref: "#/components/schemas/ToOneRelationship"
        policy:
          $ref: "#/components/schemas/ToOneRelationship"
        group:
          $ref: "#/components/schemas/ToOneRelationship"
        owner:
          $ref: "#/components/schemas/ToOneRelationship"
        users:
          $ref: "#/components/schemas/LicenseUsersRelationship"
        machines:
          $ref: "#/components/schemas/LicenseMachinesRelationship"
        tokens:
          $ref: "#/components/schemas/ToManyRelationship"
        entitlements:
          $ref: "#/components/schemas/ToManyRelationship"

    LicenseResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [licenses]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/LicenseAttributes"
        relationships:
          $ref: "#/components/schemas/LicenseRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    LicenseDocument:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/LicenseResource"
            - type: "null"

    # The owner show answers data: null for an ownerless license (the
    # shared UserDocument is not nullable).
    LicenseOwnerDocument:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/UserResource"
            - type: "null"

    LicenseListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LicenseResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    LicenseValidateMeta:
      type: object
      required: [ts, valid, detail, code]
      properties:
        ts:
          $ref: "#/components/schemas/Timestamp"
        valid:
          type: boolean
        detail:
          type: string
        code:
          type: string
        nonce:
          type: integer
        scope:
          type: object
          additionalProperties: true

    LicenseValidateDocument:
      type: object
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/LicenseResource"
            - type: "null"
        meta:
          $ref: "#/components/schemas/LicenseValidateMeta"

    # The license↔user and license↔entitlement join resources answer
    # attach; their links key is "related" (the reference's serializer
    # quirk — no self link).
    JoinLinks:
      type: object
      required: [related]
      properties:
        related:
          type: string

    LicenseUserResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [license-users]
        id:
          type: string
        attributes:
          type: object
          required: [created, updated]
          properties:
            created:
              $ref: "#/components/schemas/Timestamp"
            updated:
              $ref: "#/components/schemas/Timestamp"
        relationships:
          type: object
          required: [account, license, user]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            license:
              $ref: "#/components/schemas/ToOneRelationship"
            user:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/JoinLinks"

    LicenseUserDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LicenseUserResource"

    LicenseUserListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LicenseUserResource"

    LicenseEntitlementResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [license-entitlements]
        id:
          type: string
        attributes:
          type: object
          required: [created, updated]
          properties:
            created:
              $ref: "#/components/schemas/Timestamp"
            updated:
              $ref: "#/components/schemas/Timestamp"
        relationships:
          type: object
          required: [account, entitlement, license]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            entitlement:
              $ref: "#/components/schemas/ToOneRelationship"
            license:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/JoinLinks"

    LicenseEntitlementListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LicenseEntitlementResource"

    # Machines reached through a license's relationship (the full
    # machine group lands next; this renders the rows that exist).
    MachineAttributes:
      type: object
      required:
        [fingerprint, cores, memory, disk, ip, hostname, platform, name,
         requireHeartbeat, heartbeatStatus, heartbeatDuration, maxProcesses,
         lastCheckOut, lastHeartbeat, nextHeartbeat, metadata, created, updated]
      properties:
        fingerprint:
          type: string
        cores:
          type: ["integer", "null"]
        memory:
          type: ["integer", "null"]
        disk:
          type: ["integer", "null"]
        ip:
          type: ["string", "null"]
        hostname:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        requireHeartbeat:
          type: boolean
        heartbeatStatus:
          type: string
        heartbeatDuration:
          type: ["integer", "null"]
        maxProcesses:
          type: ["integer", "null"]
        lastCheckOut:
          type: ["string", "null"]
        lastHeartbeat:
          type: ["string", "null"]
        nextHeartbeat:
          type: ["string", "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    MachineRelationships:
      type: object
      required: [account, product, group, license, owner, components, processes]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        product:
          $ref: "#/components/schemas/ToOneRelationship"
        group:
          $ref: "#/components/schemas/ToOneRelationship"
        license:
          $ref: "#/components/schemas/ToOneRelationship"
        owner:
          $ref: "#/components/schemas/ToOneRelationship"
        components:
          $ref: "#/components/schemas/ToManyRelationship"
        processes:
          $ref: "#/components/schemas/ToManyRelationship"

    MachineResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [machines]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/MachineAttributes"
        relationships:
          $ref: "#/components/schemas/MachineRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    MachineDocument:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/MachineResource"
            - type: "null"

    MachineListDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MachineResource"
        links:
          $ref: "#/components/schemas/ListLinks"

    LicenseFileAttributes:
      type: object
      required: [certificate, algorithm, includes, ttl, expiry, issued]
      properties:
        certificate:
          type: string
        algorithm:
          type: string
        includes:
          type: array
          items:
            type: string
        ttl:
          type: ["integer", "null"]
        expiry:
          type: ["string", "null"]
        issued:
          $ref: "#/components/schemas/Timestamp"

    LicenseFileResource:
      type: object
      required: [type, id, attributes, relationships]
      properties:
        type:
          type: string
          enum: [license-files]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/LicenseFileAttributes"
        relationships:
          type: object
          required: [account, license]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            license:
              $ref: "#/components/schemas/ToOneRelationship"

    LicenseFileDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LicenseFileResource"
  responses:
    Error:
      description: Keygen JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
