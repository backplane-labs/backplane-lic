# Shared JSON:API building blocks. Everything here is wire-exact Keygen:
# attribute keys are camelCase, timestamps are RFC3339 with millisecond
# precision and a Z suffix, every always-emitted field is required.
components:
  parameters:
    AccountPath:
      name: account
      in: path
      required: true
      description: Account id (UUID) or slug.
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      description: Offset pagination page number (1-100).
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    PageSize:
      name: page[size]
      in: query
      description: Page size (1-100); defaults to the limit.
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    PageCursor:
      name: page[cursor]
      in: query
      description: Keyset pagination cursor (a record UUID).
      schema:
        type: ["string", "null"]
    Limit:
      name: limit
      in: query
      description: Number of records to return (1-100, default 10).
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    Order:
      name: order
      in: query
      description: Sort order (default desc in production).
      schema:
        type: ["string", "null"]
        enum: [asc, desc, null]

  schemas:
    Timestamp:
      # RFC3339 with exactly 3 fractional digits and a Z suffix,
      # e.g. 2026-10-22T11:23:22.953Z. Never `format: date-time`: we
      # control the rendering.
      type: string

    Metadata:
      # Free-form vendor JSON; keys are stored snake_case and rendered
      # lowerCamelCase exactly like Keygen transforms them.
      type: object
      additionalProperties: true

    ResourceIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string

    ResourceLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string

    RelationshipLinks:
      type: object
      required: [related]
      properties:
        related:
          type: ["string", "null"]

    ToOneRelationship:
      # belongs_to-style: linkage always emitted, null when absent.
      type: object
      required: [links, data]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        data:
          anyOf:
            - $ref: "#/components/schemas/ResourceIdentifier"
            - type: "null"

    ToManyRelationship:
      # has_many: related link only, plus optional meta (e.g. counts).
      type: object
      required: [links]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        meta:
          type: object
          additionalProperties: true

    PaginationMeta:
      type: object
      required: [pages, count]
      properties:
        pages:
          type: integer
        count:
          type: integer

    CollectionLinks:
      # Offset pagination links; Keygen nests pagination meta inside the
      # top-level links object. Cursor pagination uses self/next only.
      type: object
      required: [self, first, last, prev, next]
      properties:
        self:
          type: string
        first:
          type: string
        last:
          type: string
        prev:
          type: ["string", "null"]
        next:
          type: ["string", "null"]
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ErrorSource:
      type: object
      properties:
        pointer:
          type: string
        parameter:
          type: string
        header:
          type: string

    ErrorLinks:
      type: object
      properties:
        about:
          type: string

    Error:
      type: object
      required: [title, detail]
      properties:
        title:
          type: string
        detail:
          type: string
        code:
          type: ["string", "null"]
        source:
          $ref: "#/components/schemas/ErrorSource"
        links:
          $ref: "#/components/schemas/ErrorLinks"

    ErrorDocument:
      # meta.id is the request UUID on every error rendered through the
      # application (middleware-level errors have no meta).
      type: object
      required: [meta, errors]
      properties:
        meta:
          type: object
          required: [id]
          properties:
            id:
              type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"

  responses:
    Error:
      description: Keygen JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
