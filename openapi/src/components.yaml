# Shared JSON:API building blocks. Everything here is wire-exact Keygen:
# attribute keys are camelCase, timestamps are RFC3339 with millisecond
# precision and a Z suffix, every always-emitted field is required.
components:
  parameters:
    AccountPath:
      name: account
      in: path
      required: true
      description: Account id (UUID) or slug.
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      description: Offset pagination page number (1-100).
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    PageSize:
      name: page[size]
      in: query
      description: Page size (1-100); defaults to the limit.
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    PageCursor:
      name: page[cursor]
      in: query
      description: Keyset pagination cursor (a record UUID).
      schema:
        type: ["string", "null"]
    Limit:
      name: limit
      in: query
      description: Number of records to return (1-100, default 10).
      schema:
        type: ["integer", "null"]
        minimum: 1
        maximum: 100
    Order:
      name: order
      in: query
      description: Sort order (default desc in production).
      schema:
        type: ["string", "null"]
        enum: [asc, desc, null]

  schemas:
    Timestamp:
      # RFC3339 with exactly 3 fractional digits and a Z suffix,
      # e.g. 2026-10-22T11:23:22.953Z. Never `format: date-time`: we
      # control the rendering.
      type: string

    Metadata:
      # Free-form vendor JSON; keys are stored snake_case and rendered
      # lowerCamelCase exactly like Keygen transforms them.
      type: object
      additionalProperties: true

    ResourceIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string

    ResourceLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string

    RelationshipLinks:
      type: object
      required: [related]
      properties:
        related:
          type: ["string", "null"]

    ToOneRelationship:
      # belongs_to-style: linkage always emitted, null when absent.
      type: object
      required: [links, data]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        data:
          anyOf:
            - $ref: "#/components/schemas/ResourceIdentifier"
            - type: "null"

    ToManyRelationship:
      # has_many: related link only, plus optional meta (e.g. counts).
      type: object
      required: [links]
      properties:
        links:
          $ref: "#/components/schemas/RelationshipLinks"
        meta:
          type: object
          additionalProperties: true

    PaginationMeta:
      type: object
      required: [pages, count]
      properties:
        pages:
          type: integer
        count:
          type: integer

    CollectionLinks:
      # Offset pagination links; Keygen nests pagination meta inside the
      # top-level links object. Cursor pagination uses self/next only.
      type: object
      required: [self, first, last, prev, next]
      properties:
        self:
          type: string
        first:
          type: string
        last:
          type: string
        prev:
          type: ["string", "null"]
        next:
          type: ["string", "null"]
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ErrorSource:
      type: object
      properties:
        pointer:
          type: string
        parameter:
          type: string
        header:
          type: string

    ErrorLinks:
      type: object
      properties:
        about:
          type: string

    Error:
      type: object
      required: [title, detail]
      properties:
        title:
          type: string
        detail:
          type: string
        code:
          # Absent on typed-params and policy errors; never null.
          type: string
        source:
          $ref: "#/components/schemas/ErrorSource"
        links:
          $ref: "#/components/schemas/ErrorLinks"

    ErrorDocument:
      # meta.id is the request UUID on every error rendered through the
      # application (middleware-level errors have no meta).
      type: object
      required: [meta, errors]
      properties:
        meta:
          type: object
          required: [id]
          properties:
            id:
              type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"

    UserAttributes:
      type: object
      required: [fullName, firstName, lastName, email, status, role, metadata, created, updated]
      properties:
        fullName:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        status:
          type: string
        role:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    UserRelationships:
      type: object
      required: [account, group, products, licenses, machines, tokens, secondFactors]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        group:
          $ref: "#/components/schemas/ToOneRelationship"
        products:
          $ref: "#/components/schemas/ToManyRelationship"
        licenses:
          $ref: "#/components/schemas/ToManyRelationship"
        machines:
          $ref: "#/components/schemas/ToManyRelationship"
        tokens:
          $ref: "#/components/schemas/ToManyRelationship"
        secondFactors:
          $ref: "#/components/schemas/ToManyRelationship"

    UserResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [users]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/UserAttributes"
        relationships:
          $ref: "#/components/schemas/UserRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserResource"

    TokenAttributes:
      # token (the raw secret) and the activation counters are optional:
      # the secret only on creation/regeneration, the counters only on
      # activation tokens.
      type: object
      required: [kind, expiry, name, created, updated]
      properties:
        kind:
          type: string
        token:
          # Present only on creation/regeneration responses; omitted
          # everywhere else (the reference's conditional attribute).
          type: string
        expiry:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        maxActivations:
          type: ["integer", "null"]
        activations:
          type: ["integer", "null"]
        maxDeactivations:
          type: ["integer", "null"]
        deactivations:
          type: ["integer", "null"]
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    TokenRelationships:
      type: object
      required: [account, bearer]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        bearer:
          $ref: "#/components/schemas/ToOneRelationship"

    TokenResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [tokens]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/TokenAttributes"
        relationships:
          $ref: "#/components/schemas/TokenRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    TokenDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TokenResource"

    ProfileMeta:
      type: object
      required: [tokenId]
      properties:
        tokenId:
          type: ["string", "null"]

    ProfileDocument:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/UserResource"
        meta:
          $ref: "#/components/schemas/ProfileMeta"

    MeDocument:
      # The current bearer plus, for token authn, the current token in
      # included (without its secret).
      type: object
      required: [data, included]
      properties:
        data:
          $ref: "#/components/schemas/UserResource"
        included:
          type: array
          items:
            $ref: "#/components/schemas/TokenResource"

    # --- users/groups/tokens/second-factors (resource group B2) ---

    PageLinks:
      # Pagination links of a collection: absent in limit mode, full set
      # (prev/next null at the ends, meta nested) in offset mode,
      # self/next in cursor mode.
      type: object
      required: [self]
      properties:
        self:
          type: string
        first:
          type: ["string", "null"]
        last:
          type: ["string", "null"]
        prev:
          type: ["string", "null"]
        next:
          type: ["string", "null"]
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    UserCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    TokenCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    GroupAttributes:
      type: object
      required: [name, maxUsers, maxLicenses, maxMachines, metadata, created, updated]
      properties:
        name:
          type: ["string", "null"]
        maxUsers:
          type: ["integer", "null"]
        maxLicenses:
          type: ["integer", "null"]
        maxMachines:
          type: ["integer", "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    GroupRelationships:
      type: object
      required: [account, owners, users, licenses, machines]
      properties:
        account:
          $ref: "#/components/schemas/ToOneRelationship"
        owners:
          $ref: "#/components/schemas/ToManyRelationship"
        users:
          $ref: "#/components/schemas/ToManyRelationship"
        licenses:
          $ref: "#/components/schemas/ToManyRelationship"
        machines:
          $ref: "#/components/schemas/ToManyRelationship"

    GroupResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [groups]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/GroupAttributes"
        relationships:
          $ref: "#/components/schemas/GroupRelationships"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    GroupDocument:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/GroupResource"
            - type: "null"

    GroupCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GroupResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    GroupOwnerResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [group-owners]
        id:
          type: string
        attributes:
          type: object
          required: [created, updated]
          properties:
            created:
              $ref: "#/components/schemas/Timestamp"
            updated:
              $ref: "#/components/schemas/Timestamp"
        relationships:
          type: object
          required: [account, group, user]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            group:
              $ref: "#/components/schemas/ToOneRelationship"
            user:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    GroupOwnerDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/GroupOwnerResource"

    GroupOwnerCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GroupOwnerResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    SecondFactorAttributes:
      # uri/secret render only while the factor is disabled.
      type: object
      required: [enabled, created, updated]
      properties:
        # uri/secret render only while the factor is disabled; omitted
        # otherwise.
        uri:
          type: string
        secret:
          type: string
        enabled:
          type: boolean
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"

    SecondFactorResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          enum: [second-factors]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SecondFactorAttributes"
        relationships:
          type: object
          required: [account, user]
          properties:
            account:
              $ref: "#/components/schemas/ToOneRelationship"
            user:
              $ref: "#/components/schemas/ToOneRelationship"
        links:
          $ref: "#/components/schemas/ResourceLinks"

    SecondFactorDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SecondFactorResource"

    SecondFactorCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecondFactorResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    # Minimal product/license/machine documents for the user and group
    # relationship indexes. The full resource groups own their schemas;
    # these render the same wire shapes for records reached through the
    # users/groups relationships.
    UserProductAttributes:
      type: object
      additionalProperties: true

    UserProductResource:
      type: object
      required: [type, id, links]
      properties:
        type:
          type: string
          enum: [products]
        id:
          type: string
        attributes:
          type: ["object", "null"]
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserProductDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserProductResource"

    UserProductCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserProductResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    UserLicenseResource:
      type: object
      required: [type, id, links]
      properties:
        type:
          type: string
          enum: [licenses]
        id:
          type: string
        attributes:
          type: ["object", "null"]
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserLicenseDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserLicenseResource"

    UserLicenseCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserLicenseResource"
        links:
          $ref: "#/components/schemas/PageLinks"

    UserMachineResource:
      type: object
      required: [type, id, links]
      properties:
        type:
          type: string
          enum: [machines]
        id:
          type: string
        attributes:
          type: ["object", "null"]
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
        links:
          $ref: "#/components/schemas/ResourceLinks"

    UserMachineDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserMachineResource"

    UserMachineCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserMachineResource"
        links:
          $ref: "#/components/schemas/PageLinks"

  responses:
    Error:
      description: Keygen JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: "#/components/schemas/ErrorDocument"
