# Tokens: generate (POST /tokens), index, show, regenerate (PUT member
# and the deprecated PUT collection) and revoke. The bearer sub-routes
# for products/licenses live with their resource groups; the user
# sub-routes live in users.yaml.
paths:
  /v1/accounts/{account}/tokens:
    post:
      operationId: generateToken
      summary: Generate a token
      description: >-
        Basic email:password (with meta.otp for two-factor users) or any
        token authentication. The response carries the token's raw secret
        exactly once.
      parameters:
        - $ref: "#/components/parameters/AccountPath"
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              # Decoded as a free-form object and shape-validated by the
              # scenario, reproducing the reference's typed-params errors
              # ("unpermitted parameter", "is missing", "is invalid") with
              # their exact pointers.
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Token document (with the raw secret).
          headers:
            Location:
              description: The new token's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listTokens
      summary: List tokens
      parameters:
        - $ref: "#/components/parameters/AccountPath"
      responses:
        "200":
          description: Token collection (no secrets).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenCollectionDocument"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: regenerateCurrentToken
      summary: Regenerate the current token (deprecated)
      description: 404 unless the request itself is token-authenticated.
      parameters:
        - $ref: "#/components/parameters/AccountPath"
      responses:
        "200":
          description: Token document (with the new raw secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        default:
          $ref: "#/components/responses/Error"

  /v1/accounts/{account}/tokens/{tokenId}:
    get:
      operationId: showToken
      summary: Show a token (no secret)
      parameters:
        - $ref: "#/components/parameters/AccountPath"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token document (no secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: regenerateToken
      summary: Regenerate a token
      parameters:
        - $ref: "#/components/parameters/AccountPath"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token document (with the new raw secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TokenDocument"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeToken
      summary: Revoke a token
      parameters:
        - $ref: "#/components/parameters/AccountPath"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No content.
        default:
          $ref: "#/components/responses/Error"
