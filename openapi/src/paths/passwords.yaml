# Passwords: the password-reset request endpoint. Always 204 (unknown
# emails are indistinguishable), no authentication at all.
paths:
  /v1/accounts/{account}/passwords:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      description: Always answers 204; unknown emails trigger nothing.
      parameters:
        - $ref: "#/components/parameters/AccountPath"
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: No content.
        default:
          $ref: "#/components/responses/Error"
