openapi: 3.1.0
info:
  title: backplane-lic
  summary: Keygen CE-compatible licensing API (singleplayer, API 1.7).
  description: 'A 1:1 reproduction of the Keygen CE 1.7 licensing API: same URLs,

    JSON:API documents, headers, error codes and behaviour. Paths are

    written in the canonical multiplayer form `/v1/accounts/{account}/...`;

    the bare singleplayer form `/v1/<resource>...` is rewritten to it by

    the server before routing.

    '
  version: 1.7.0
paths:
  /v1/accounts/{account}/components:
    get:
      operationId: indexComponents
      summary: List machine components
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Component collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ComponentListDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createComponent
      summary: Create a machine component
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Component document.
          headers:
            Location:
              description: The new component's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ComponentDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/components/{componentId}:
    get:
      operationId: showComponent
      summary: Retrieve a machine component
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/ComponentPath'
      responses:
        '200':
          description: Component document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ComponentDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateComponent
      summary: Update a machine component
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/ComponentPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Component document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ComponentDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteComponent
      summary: Delete a machine component
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/ComponentPath'
      responses:
        '204':
          description: Component deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/components/{componentId}/machine:
    get:
      operationId: showComponentMachine
      summary: Retrieve a component's machine
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/ComponentPath'
      responses:
        '200':
          description: Machine document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MachineDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/components/{componentId}/license:
    get:
      operationId: showComponentLicense
      summary: Retrieve a component's license
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/ComponentPath'
      responses:
        '200':
          description: License document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/components/{componentId}/product:
    get:
      operationId: showComponentProduct
      summary: Retrieve a component's product
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/ComponentPath'
      responses:
        '200':
          description: Product document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ProductDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/machines/{machineId}/components:
    get:
      operationId: indexMachineComponents
      summary: List a machine's components
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/MachinePath'
      responses:
        '200':
          description: Component collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ComponentListDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/machines/{machineId}/components/{componentId}:
    get:
      operationId: showMachineComponent
      summary: Retrieve one of a machine's components
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/MachinePath'
      - $ref: '#/components/parameters/ComponentPath'
      responses:
        '200':
          description: Component document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ComponentDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/ping:
    get:
      operationId: ping
      summary: Liveness ping
      description: Empty 200 response; outside content negotiation, any Accept works.
      responses:
        '200':
          description: Empty body.
        default:
          $ref: '#/components/responses/Error'
  /v1/health:
    get:
      operationId: health
      summary: Readiness probe
      description: 204 when the service is up.
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}:
    get:
      operationId: getAccount
      summary: Show the account
      description: The configured account with its public keys in top-level meta.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Account document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccountDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/me:
    get:
      operationId: me
      summary: The current bearer
      description: The authenticated bearer's document; a token-authenticated request also includes the
        current token (without its secret) in included.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Bearer document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MeDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/profile:
    get:
      operationId: profile
      summary: The current bearer's profile
      description: The authenticated bearer's document with the current token id in meta.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Profile document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/entitlements:
    get:
      operationId: indexEntitlements
      summary: List entitlements
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Entitlement collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntitlementListDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createEntitlement
      summary: Create an entitlement
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Entitlement document.
          headers:
            Location:
              description: The new entitlement's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntitlementDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/entitlements/{entitlementId}:
    get:
      operationId: showEntitlement
      summary: Retrieve an entitlement (by id or code)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/EntitlementPath'
      responses:
        '200':
          description: Entitlement document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntitlementDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEntitlement
      summary: Update an entitlement
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/EntitlementPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Entitlement document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntitlementDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyEntitlement
      summary: Delete an entitlement
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/EntitlementPath'
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups:
    get:
      operationId: listGroups
      summary: List groups
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Group collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGroup
      summary: Create a group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Group document.
          headers:
            Location:
              description: The new group's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}:
    get:
      operationId: showGroup
      summary: Show a group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGroup
      summary: Update a group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Group document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGroup
      summary: Delete a group (members keep existing, group nulled)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/users:
    get:
      operationId: listGroupUsers
      summary: List a group's users
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/users/{userId}:
    get:
      operationId: showGroupUser
      summary: Show one of a group's users (id or email alias)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/licenses:
    get:
      operationId: listGroupLicenses
      summary: List a group's licenses
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: License collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseListDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/licenses/{licenseId}:
    get:
      operationId: showGroupLicense
      summary: Show one of a group's licenses (id or key alias)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: License document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/machines:
    get:
      operationId: listGroupMachines
      summary: List a group's machines
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Machine collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MachineListDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/machines/{machineId}:
    get:
      operationId: showGroupMachine
      summary: Show one of a group's machines (id or fingerprint alias)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: machineId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Machine document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MachineDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/owners:
    get:
      operationId: listGroupOwners
      summary: List a group's owners (group-owner join resources)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group-owner collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupOwnerCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: attachGroupOwners
      summary: Attach users as group owners
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Group-owner collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupOwnerCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: detachGroupOwners
      summary: Detach group owners
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/owners/{ownerId}:
    get:
      operationId: showGroupOwner
      summary: Show one of a group's owners
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group-owner document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupOwnerDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/keys:
    get:
      operationId: indexKeys
      summary: List keys
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Key collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/KeyListDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKey
      summary: Create a key
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Key document.
          headers:
            Location:
              description: The new key's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/KeyDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/keys/{keyId}:
    get:
      operationId: showKey
      summary: Retrieve a key
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/KeyPath'
      responses:
        '200':
          description: Key document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/KeyDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateKey
      summary: Update a key
      description: Only the key attribute may change; relationships are not accepted.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/KeyPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Key document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/KeyDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyKey
      summary: Delete a key
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/KeyPath'
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/keys/{keyId}/product:
    get:
      operationId: showKeyProduct
      summary: Retrieve a key's product (through its policy)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/KeyPath'
      responses:
        '200':
          description: Product document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ProductDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/keys/{keyId}/policy:
    get:
      operationId: showKeyPolicy
      summary: Retrieve a key's policy
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/KeyPath'
      responses:
        '200':
          description: Policy document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/licenses:
    get:
      operationId: indexLicenses
      summary: List licenses
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: License collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseListDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createLicense
      summary: Create a license
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: License document.
          headers:
            Location:
              description: The new license's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/licenses/{licenseId}:
    get:
      operationId: showLicense
      summary: Retrieve a license (by id or key)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/LicensePath'
      responses:
        '200':
          description: License document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLicense
      summary: Update a license
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/LicensePath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: License document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LicenseDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyLicense
      summary: Delete a license
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/LicensePath'
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/licenses/{licenseId}/machines:
    get:
      operationId: indexLicenseMachines
      summary: List a license's machines
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - $ref: '#/components/parameters/LicensePath'
      responses:
        '200':
          description: Machine collection.
          content:
