openapi: 3.1.0
info:
  title: backplane-lic
  summary: Keygen CE-compatible licensing API (singleplayer, API 1.7).
  description: 'A 1:1 reproduction of the Keygen CE 1.7 licensing API: same URLs,

    JSON:API documents, headers, error codes and behaviour. Paths are

    written in the canonical multiplayer form `/v1/accounts/{account}/...`;

    the bare singleplayer form `/v1/<resource>...` is rewritten to it by

    the server before routing.

    '
  version: 1.7.0
paths:
  /v1/ping:
    get:
      operationId: ping
      summary: Liveness ping
      description: Empty 200 response; outside content negotiation, any Accept works.
      responses:
        '200':
          description: Empty body.
        default:
          $ref: '#/components/responses/Error'
  /v1/health:
    get:
      operationId: health
      summary: Readiness probe
      description: 204 when the service is up.
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}:
    get:
      operationId: getAccount
      summary: Show the account
      description: The configured account with its public keys in top-level meta.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Account document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccountDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/me:
    get:
      operationId: me
      summary: The current bearer
      description: The authenticated bearer's document; a token-authenticated request also includes the
        current token (without its secret) in included.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Bearer document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MeDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/profile:
    get:
      operationId: profile
      summary: The current bearer's profile
      description: The authenticated bearer's document with the current token id in meta.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Profile document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ProfileDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups:
    get:
      operationId: listGroups
      summary: List groups
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Group collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGroup
      summary: Create a group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Group document.
          headers:
            Location:
              description: The new group's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}:
    get:
      operationId: showGroup
      summary: Show a group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGroup
      summary: Update a group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Group document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGroup
      summary: Delete a group (members keep existing, group nulled)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/users:
    get:
      operationId: listGroupUsers
      summary: List a group's users
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/users/{userId}:
    get:
      operationId: showGroupUser
      summary: Show one of a group's users (id or email alias)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/licenses:
    get:
      operationId: listGroupLicenses
      summary: List a group's licenses
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: License collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserLicenseCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/licenses/{licenseId}:
    get:
      operationId: showGroupLicense
      summary: Show one of a group's licenses (id or key alias)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: License document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserLicenseDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/machines:
    get:
      operationId: listGroupMachines
      summary: List a group's machines
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Machine collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserMachineCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/machines/{machineId}:
    get:
      operationId: showGroupMachine
      summary: Show one of a group's machines (id or fingerprint alias)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: machineId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Machine document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserMachineDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/owners:
    get:
      operationId: listGroupOwners
      summary: List a group's owners (group-owner join resources)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group-owner collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupOwnerCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: attachGroupOwners
      summary: Attach users as group owners
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Group-owner collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupOwnerCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: detachGroupOwners
      summary: Detach group owners
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/groups/{groupId}/owners/{ownerId}:
    get:
      operationId: showGroupOwner
      summary: Show one of a group's owners
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group-owner document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupOwnerDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/passwords:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      description: Always answers 204; unknown emails trigger nothing.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/tokens:
    post:
      operationId: generateToken
      summary: Generate a token
      description: Basic email:password (with meta.otp for two-factor users) or any token authentication.
        The response carries the token's raw secret exactly once.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Token document (with the raw secret).
          headers:
            Location:
              description: The new token's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listTokens
      summary: List tokens
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Token collection (no secrets).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: regenerateCurrentToken
      summary: Regenerate the current token (deprecated)
      description: 404 unless the request itself is token-authenticated.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Token document (with the new raw secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/tokens/{tokenId}:
    get:
      operationId: showToken
      summary: Show a token (no secret)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token document (no secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: regenerateToken
      summary: Regenerate a token
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token document (with the new raw secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeToken
      summary: Revoke a token
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users:
    get:
      operationId: listUsers
      summary: List users
      description: Users of the account (default roles[]=user), filtered and paginated.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: User collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUser
      summary: Create a user
      description: Creates a user (anonymous only when the account is not protected).
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: User document.
          headers:
            Location:
              description: The new user's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}:
    get:
      operationId: showUser
      summary: Show a user
      description: The user by UUID or (downcased) email alias.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        description: User id (UUID) or email alias.
        schema:
          type: string
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateUser
      summary: Update a user
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteUser
      summary: Delete a user
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/actions/update-password:
    post:
      operationId: updateUserPassword
      summary: Change the bearer's own password
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/actions/reset-password:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password with a reset token
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/actions/ban:
    post:
      operationId: banUser
      summary: Ban a user
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User document (status BANNED).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/actions/unban:
    post:
      operationId: unbanUser
      summary: Unban a user
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/second-factors:
    get:
      operationId: listUserSecondFactors
      summary: List a user's second factors
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Second-factor collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SecondFactorCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUserSecondFactor
      summary: Create a TOTP second factor
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Second-factor document (secret and uri included).
          headers:
            Location:
              description: The new second factor's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SecondFactorDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/second-factors/{secondFactorId}:
    get:
      operationId: showUserSecondFactor
      summary: Show a second factor
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: secondFactorId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Second-factor document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SecondFactorDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateUserSecondFactor
      summary: Enable or disable a second factor (requires meta.otp)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: secondFactorId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Second-factor document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SecondFactorDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteUserSecondFactor
      summary: Delete a second factor
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: secondFactorId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/products:
    get:
      operationId: listUserProducts
      summary: List a user's products
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Product collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserProductCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/products/{productId}:
    get:
      operationId: showUserProduct
      summary: Show one of a user's products
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Product document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserProductDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/licenses:
    get:
      operationId: listUserLicenses
      summary: List a user's licenses
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
