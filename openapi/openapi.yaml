components:
  parameters:
    AccountPath:
      name: account
      in: path
      required: true
      description: Account id (UUID) or slug.
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      description: Offset pagination page number (1-100).
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
    PageSize:
      name: page[size]
      in: query
      description: Page size (1-100); defaults to the limit.
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
    PageCursor:
      name: page[cursor]
      in: query
      description: Keyset pagination cursor (a record UUID).
      schema:
        type:
        - string
        - 'null'
    Limit:
      name: limit
      in: query
      description: Number of records to return (1-100, default 10).
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
    Order:
      name: order
      in: query
      description: Sort order (default desc in production).
      schema:
        type:
        - string
        - 'null'
        enum:
        - asc
        - desc
        - null
    ProductPath:
      name: productId
      in: path
      required: true
      description: Product id (UUID) or code.
      schema:
        type: string
    PolicyPath:
      name: policyId
      in: path
      required: true
      description: Policy id (UUID).
