        in: path
        required: true
        schema:
          type: string
      - name: machineId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Machine document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserMachineDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/tokens:
    get:
      operationId: listUserTokens
      summary: List a user's tokens
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token collection (no secrets).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenCollectionDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createUserToken
      summary: Generate a token for a user
      description: Answers 200 (not 201) with the raw secret included once.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Token document (with the raw secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/tokens/{tokenId}:
    get:
      operationId: showUserToken
      summary: Show one of a user's tokens
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token document (no secret).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/users/{userId}/group:
    get:
      operationId: showUserGroup
      summary: Show a user's group (data null when none)
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group document (data null when the user has no group).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GroupDocument'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateUserGroup
      summary: Set or remove a user's group
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: User document (with the updated group linkage).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Webhook endpoint collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointListDocument'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWebhookEndpoint
      summary: Create a webhook endpoint
      description: A product bearer scopes the endpoint to its own product even without the product relationship
        (the reference's Zapier workaround).
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Webhook endpoint document.
          headers:
            Location:
              description: The new endpoint's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/webhook-endpoints/{webhookEndpointId}:
    get:
      operationId: showWebhookEndpoint
      summary: Show a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: webhookEndpointId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook endpoint document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocument'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateWebhookEndpoint
      summary: Update a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: webhookEndpointId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook endpoint document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyWebhookEndpoint
      summary: Delete a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: webhookEndpointId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/webhook-events:
    get:
      operationId: listWebhookEvents
      summary: List webhook events
      description: Supports the events[] filter (exact event names; an unknown name matches nothing) and
        the shared pagination parameters.
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      responses:
        '200':
          description: Webhook event collection.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEventListDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/webhook-events/{webhookEventId}:
    get:
      operationId: showWebhookEvent
      summary: Show a webhook event
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: webhookEventId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook event document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEventDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyWebhookEvent
      summary: Delete a webhook event
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: webhookEventId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'
  /v1/accounts/{account}/webhook-events/{webhookEventId}/actions/retry:
    post:
      operationId: retryWebhookEvent
      summary: Retry a webhook event
      description: 'Enqueues a fresh delivery: a NEW webhook event copying the payload, api version and
        idempotency token of the original.'
      parameters:
      - $ref: '#/components/parameters/AccountPath'
      - name: webhookEventId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: The new webhook event document.
          headers:
            Location:
              description: The new event's canonical URL.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEventDocument'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    AccountPath:
      name: account
      in: path
      required: true
      description: Account id (UUID) or slug.
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      description: Offset pagination page number (1-100).
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
    PageSize:
      name: page[size]
      in: query
      description: Page size (1-100); defaults to the limit.
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
    PageCursor:
      name: page[cursor]
      in: query
      description: Keyset pagination cursor (a record UUID).
      schema:
        type:
        - string
        - 'null'
    Limit:
      name: limit
      in: query
      description: Number of records to return (1-100, default 10).
      schema:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
    Order:
      name: order
      in: query
      description: Sort order (default desc in production).
      schema:
        type:
        - string
        - 'null'
        enum:
        - asc
        - desc
        - null
    ProductPath:
      name: productId
      in: path
      required: true
      description: Product id (UUID) or code.
      schema:
        type: string
    PolicyPath:
      name: policyId
      in: path
      required: true
      description: Policy id (UUID).
      schema:
        type: string
    EntitlementPath:
      name: entitlementId
      in: path
      required: true
      description: Entitlement id (UUID) or code.
      schema:
        type: string
    KeyPath:
      name: keyId
      in: path
      required: true
      description: Key id (UUID).
      schema:
        type: string
    LicensePath:
      name: licenseId
      in: path
      required: true
      description: License id (UUID) or key.
      schema:
        type: string
    MachinePath:
      name: machineId
      in: path
      required: true
      description: Machine id (UUID) or fingerprint.
      schema:
        type: string
    TokenPath:
      name: tokenId
      in: path
      required: true
      description: Token id (UUID).
      schema:
        type: string
    UserPath:
      name: userId
      in: path
      required: true
      description: User id (UUID) or email.
      schema:
        type: string
  schemas:
    Timestamp:
      type: string
    Metadata:
      type: object
      additionalProperties: true
    ResourceIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
    ResourceLinks:
      type: object
      required:
      - self
      properties:
        self:
          type: string
    RelationshipLinks:
      type: object
      required:
      - related
      properties:
        related:
          type:
          - string
          - 'null'
    ToOneRelationship:
      type: object
      required:
      - links
      - data
      properties:
        links:
          $ref: '#/components/schemas/RelationshipLinks'
        data:
          anyOf:
          - $ref: '#/components/schemas/ResourceIdentifier'
          - type: 'null'
    ToManyRelationship:
      type: object
      required:
      - links
      properties:
        links:
          $ref: '#/components/schemas/RelationshipLinks'
        meta:
          type: object
          additionalProperties: true
    PaginationMeta:
      type: object
      required:
      - pages
      - count
      properties:
        pages:
          type: integer
        count:
          type: integer
    ErrorSource:
      type: object
      properties:
        pointer:
          type: string
        parameter:
          type: string
        header:
          type: string
    ErrorLinks:
      type: object
      properties:
        about:
          type: string
    Error:
      type: object
      required:
      - title
      - detail
      properties:
        title:
          type: string
        detail:
          type: string
        code:
          type: string
        source:
          $ref: '#/components/schemas/ErrorSource'
        links:
          $ref: '#/components/schemas/ErrorLinks'
    ErrorDocument:
      type: object
      required:
      - meta
      - errors
      properties:
        meta:
          type: object
          required:
          - id
          properties:
            id:
              type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    UserAttributes:
      type: object
      required:
      - fullName
      - firstName
      - lastName
      - email
      - status
      - role
      - metadata
      - created
      - updated
      properties:
        fullName:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        status:
          type: string
        role:
          type: string
        metadata:
