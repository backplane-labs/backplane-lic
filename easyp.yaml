# Internal console API; tools are pinned by Makefile.
lint:
  use:
    - DEFAULT
  service_suffix: Service
  allow_comment_ignores: false
  except:
    - PACKAGE_DIRECTORY_MATCH
generate:
  inputs:
    - directory: proto
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - name: go-grpc
      out: .
      opts:
        paths: source_relative
    - name: es
      out: web/src/gen
      opts:
        target: ts
    - name: ws-es
      out: web/src/gen
